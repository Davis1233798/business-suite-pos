name: POS validation and container publication
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  pos:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: ''
          - runner: ubuntu-24.04-arm
            suffix: '-arm64'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm run install:ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: go -C backend test -race -timeout=20m ./...
      - run: npm run web:build
      - name: Build POS image
        run: docker build --build-arg SUITE_RELEASE_SHA="${GITHUB_SHA}" -f infra/linux/Dockerfile.station -t pos-ci:${GITHUB_SHA} .
      - name: Smoke-test isolated POS image
        run: |
          set -euo pipefail
          docker run -d --name pos-ci -p 127.0.0.1:18095:8095 pos-ci:${GITHUB_SHA}
          trap 'docker logs pos-ci; docker rm -f pos-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18095/api/health | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["data"]["revision"] == os.environ["GITHUB_SHA"]'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18095/mes/login)" = 404
      - name: Install Chromium for print preview lifecycle acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify print preview request cancellation in the POS image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name pos-browser -p 127.0.0.1:18095:8095 pos-ci:${GITHUB_SHA}
          trap 'docker logs pos-browser; docker rm -f pos-browser' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18095/api/health | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["data"]["revision"] == os.environ["GITHUB_SHA"]'
          npx playwright test --config playwright.lifecycle.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos-print-preview-browser-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish POS image on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/business-suite-pos-station"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag pos-ci:${GITHUB_SHA} "$image:${GITHUB_SHA}${{ matrix.suffix }}"
          docker push "$image:${GITHUB_SHA}${{ matrix.suffix }}"

  deploy-private-oci:
    name: Deploy private POS runtime to OCI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.POS_DEPLOY_ENABLED == 'true'
    needs: [pos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pos-private-oci
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify this is still the latest main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping this deployment."
            exit 1
          fi
      - name: Resolve immutable ARM64 registry digest
        id: image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/business-suite-pos-station"
          digest=$(docker buildx imagetools inspect "$image:${GITHUB_SHA}-arm64" | awk '$1 == "Digest:" { print $2; exit }')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Configure POS-only SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.OCI_POS_DEPLOY_KEY }}
          HOST_KEY: ${{ secrets.OCI_POS_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$HOST_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/pos_deploy
          chmod 600 ~/.ssh/pos_deploy
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      - name: Deploy by exact image digest
        env:
          POS_HOST: ${{ secrets.OCI_POS_HOST }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$POS_HOST"
          [[ "$POS_HOST" =~ ^pos@[A-Za-z0-9.-]+$ ]]
          ssh -i ~/.ssh/pos_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=15 "$POS_HOST" "deploy $GITHUB_SHA $IMAGE_DIGEST"
